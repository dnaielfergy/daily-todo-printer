name: Household Notion MCP (read/write guarded)
on:
  pull_request:
    paths:
      - "integrations/household-notion-mcp/**"
      - ".github/workflows/household-notion-mcp.yml"
  push:
    paths:
      - "integrations/household-notion-mcp/**"
      - ".github/workflows/household-notion-mcp.yml"
jobs:
  test-and-bundle:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integrations/household-notion-mcp
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: npm install --no-audit --no-fund
      - run: npm test
      - run: npm run check
