[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "receipt-printer-todo"
version = "0.1.0"
description = "Local-first tactile todo system for an 80mm receipt printer."
requires-python = ">=3.11"
dependencies = []

[project.scripts]
receipt-todo = "receipt_todo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
